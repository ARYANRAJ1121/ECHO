name: ECHO Antitrust Simulator CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run automated test suite
        run: |
          python -m pytest -v --ignore=tests/test_llm_provider.py || python -m pytest -v tests/test_policy.py tests/test_mixed.py tests/test_network_detector.py tests/test_xai_shap.py tests/test_macro.py tests/test_audit_manifest.py
